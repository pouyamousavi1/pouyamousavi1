<svg viewBox="0 0 1200 400" width="1200" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pouya Mousavi — Full-Stack Developer, Australia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35D0BA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#35D0BA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#03080B" flood-opacity="0.4"/>
    </filter>
    <filter id="blurA" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="20"/>
    </clipPath>
    <style>
      .enter { animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; }
      .d3 { animation-delay: 0.4s; } .d4 { animation-delay: 0.55s; }
      .float { animation: floatY 6.5s ease-in-out infinite; }
      .f1 { animation-delay: 0s; } .f2 { animation-delay: 1.6s; }
      .f3 { animation-delay: 3.2s; } .f4 { animation-delay: 2.2s; }
      .driftA { animation: driftA 18s ease-in-out infinite; }
      .driftB { animation: driftB 24s ease-in-out infinite; }
      .stars1 { animation: driftA 45s ease-in-out infinite; }
      .stars2 { animation: driftB 60s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      @keyframes driftA {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(28px, -16px); }
      }
      @keyframes driftB {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-32px, 12px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .enter, .float, .driftA, .driftB, .stars1, .stars2, .pulse { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>

    <!-- depth layer: glow orbs -->
    <circle class="driftA" cx="170" cy="80" r="150" fill="url(#orbA)" filter="url(#blurA)"/>
    <circle class="driftB" cx="1030" cy="330" r="180" fill="url(#orbB)" filter="url(#blurA)"/>

    <!-- depth layer: far stars (slower, dimmer) -->
    <g class="stars2" fill="#58A6FF" opacity="0.18">
      <circle cx="90" cy="300" r="1.4"/><circle cx="240" cy="60" r="1.2"/>
      <circle cx="420" cy="340" r="1.5"/><circle cx="560" cy="50" r="1.2"/>
      <circle cx="760" cy="330" r="1.4"/><circle cx="930" cy="70" r="1.2"/>
      <circle cx="1120" cy="250" r="1.5"/><circle cx="1050" cy="120" r="1.2"/>
    </g>
    <!-- depth layer: near stars (faster, brighter) -->
    <g class="stars1" fill="#9FCBFF" opacity="0.32">
      <circle cx="150" cy="200" r="2"/><circle cx="330" cy="110" r="1.8"/>
      <circle cx="500" cy="290" r="2"/><circle cx="700" cy="90" r="1.8"/>
      <circle cx="860" cy="250" r="2"/><circle cx="1000" cy="180" r="1.8"/>
      <circle cx="1150" cy="330" r="2"/><circle cx="60" cy="120" r="1.8"/>
    </g>

    <!-- name + subtitle -->
    <g class="enter d1">
      <text x="600" y="178" text-anchor="middle" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="1">Pouya Mousavi</text>
      <rect x="570" y="204" width="60" height="3" rx="1.5" fill="#58A6FF"/>
      <text x="600" y="242" text-anchor="middle" font-size="17" font-weight="500" fill="#9FB9C9" letter-spacing="4">FULL-STACK DEVELOPER &#183; AUSTRALIA</text>
    </g>

    <!-- floating glass cards -->
    <g transform="translate(88, 96) rotate(-3)">
      <g class="enter d2"><g class="float f1">
        <rect width="176" height="54" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.22" filter="url(#cardShadow)"/>
        <rect x="1" y="1" width="174" height="26" rx="13" fill="url(#sheen)" opacity="0.35"/>
        <circle class="pulse" cx="26" cy="27" r="4" fill="#58A6FF"/>
        <text x="42" y="33" font-size="15" font-weight="600" fill="#E6EEF5">AI Engineering</text>
      </g></g>
    </g>

    <g transform="translate(64, 262) rotate(2)">
      <g class="enter d3"><g class="float f2">
        <rect width="214" height="54" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" filter="url(#cardShadow)"/>
        <rect x="1" y="1" width="212" height="26" rx="13" fill="url(#sheen)" opacity="0.3"/>
        <circle class="pulse" cx="26" cy="27" r="4" fill="#35D0BA"/>
        <text x="42" y="33" font-size="15" font-weight="600" fill="#DDE9F1">Financial Dashboards</text>
      </g></g>
    </g>

    <g transform="translate(922, 88) rotate(2.5)">
      <g class="enter d3"><g class="float f3">
        <rect width="208" height="54" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" filter="url(#cardShadow)"/>
        <rect x="1" y="1" width="206" height="26" rx="13" fill="url(#sheen)" opacity="0.3"/>
        <circle class="pulse" cx="26" cy="27" r="4" fill="#35D0BA"/>
        <text x="42" y="33" font-size="15" font-weight="600" fill="#DDE9F1">Community Platforms</text>
      </g></g>
    </g>

    <g transform="translate(946, 258) rotate(-2)">
      <g class="enter d4"><g class="float f4">
        <rect width="190" height="54" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.22" filter="url(#cardShadow)"/>
        <rect x="1" y="1" width="188" height="26" rx="13" fill="url(#sheen)" opacity="0.35"/>
        <circle class="pulse" cx="26" cy="27" r="4" fill="#58A6FF"/>
        <text x="42" y="33" font-size="15" font-weight="600" fill="#E6EEF5">Scalable Systems</text>
      </g></g>
    </g>
  </g>
</svg>
